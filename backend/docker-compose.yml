services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3.13.7-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: BeautyStudio.Api/Dockerfile
    env_file: .env
    restart: on-failure
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5000:8080"
    volumes:
      - api-uploads:/app/wwwroot/uploads
      - api-private-uploads:/app/private-uploads

  worker:
    build:
      context: .
      dockerfile: BeautyStudio.Worker/Dockerfile
    env_file: .env
    restart: on-failure
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
  api-uploads:
  api-private-uploads:
  rabbitmq-data:
